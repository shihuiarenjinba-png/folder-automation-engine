name: Folder automation safety regression
on:
  push:
    branches:
      - "safety/folder-collision-guard-20261018"
  pull_request:
    paths:
      - "folder_automation.py"
      - "tests/test_folder_automation_safety.py"
      - ".github/workflows/folder-safety-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and compilation check
        run: python -m compileall -q folder_automation.py tests/test_folder_automation_safety.py
      - name: Folder safety regression tests
        run: python -m unittest discover -s tests -p "test_folder_automation_safety.py" -v
