name: Guided folder GUI and safe copy/move tests

on:
  push:
    branches:
      - "ux/folder-guided-desktop-20261018"
  pull_request:
    paths:
      - "folder_automation.py"
      - "folder_desktop_app.py"
      - "folder_desktop_flow.py"
      - "ui_preferences.py"
      - "tests/test_folder_gui_flow.py"
      - "tests/test_folder_gui_watcher.py"
      - "tests/test_folder_locale_persistence.py"
      - "tests/test_folder_config_reload.py"
      - "tests/test_ui_preferences.py"
      - ".github/workflows/folder-gui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile check
        run: python -m compileall -q folder_automation.py folder_desktop_flow.py folder_desktop_app.py tests
      - name: No-display Folder GUI, watcher, config and filesystem safety tests
        run: python -m unittest discover -s tests -p "test_folder_*.py" -v
      - name: Versioned local preference safety tests
        run: python -m unittest discover -s tests -p "test_ui_preferences.py" -v
